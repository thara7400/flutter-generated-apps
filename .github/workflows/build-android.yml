name: Flutter Android APK / iOS ipa

on:
  workflow_dispatch:
  push:
    branches: [master]
  repository_dispatch:
    types: [build-flutter-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.10'
          cache: true

      # Maven Central rate-limits anonymous requests from shared Actions IPs
      # (HTTP 429), which broke run #51. Caching the resolved artifacts means
      # later runs do not hit the network at all.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Without this the APK is signed with a debug key the runner generates fresh
      # each time, and Android will not install it over an earlier build.
      # A missing secret is not an error: the build falls back to debug signing.
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; this APK will be debug-signed and cannot upgrade an earlier install"
            exit 0
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # Retry on top of the cache: a cold cache can still hit a 429.
      # BUILD_NUMBER goes through env: to avoid the github.run autolink
      # corruption seen when the number appears literally in the file.
      #
      # --split-per-abi cuts the arm64 APK from 45MB to 16MB, which matters
      # because visitors download it over the venue connection.
      # Only arm64 is distributed; 32-bit devices are out of scope.
      - name: Build APK (release)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release --split-per-abi --build-number="${BUILD_NUMBER}"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "::warning::Build attempt ${attempt} failed, retrying in ${delay}s (transient Maven Central 429 is a known cause)"
              sleep "${delay}"
            fi
          done
          echo "::error::Build failed after 3 attempts"
          exit 1

      # Self-hosted distribution. continue-on-error for the same
      # reason as the notify steps: the job status should track the build, and
      # the QR falls back to the Firebase invite URL when this does not arrive.
      - name: Upload APK to orchestrator
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          curl -sS --fail-with-body --connect-timeout 10 --max-time 300 \
            -X POST "${WEBHOOK_URL}/api/apps/upload?commitSha=${COMMIT_SHA}&runId=${RUN_ID}&versionCode=${BUILD_NUMBER}" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      # Firebase is only the QR fallback now that the APK is self-hosted.
      # Without continue-on-error its outage fails the whole job,
      # the success notify is skipped, and the visitor sees "build failed"
      # next to an APK that is already downloadable — run #62 did exactly this.
      - name: Distribute to Firebase
        id: distribute
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: demo-testers
          file: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          releaseNotes: |
            Build: ${{ env.BUILD_RUN_ID }}
            Trigger: ${{ github.event_name }}
            Commit: ${{ github.sha }}
        env:
          BUILD_RUN_ID: ${{ github.run_id }}

      # continue-on-error hides the failure from the step conclusion,
      # so raise an annotation: those are readable without a token, which is how
      # run #62 was diagnosed in the first place.
      - name: Flag Firebase distribution failure
        if: steps.distribute.outcome != 'success'
        run: |
          echo "::warning::Firebase distribution did not succeed (${{ steps.distribute.outcome }}); the self-hosted APK is unaffected but the QR has no invite-URL fallback"

      # continue-on-error keeps the job status equal to the build status.
      # Without it, an unreachable orchestrator marks a green build as failed
      # (a real run hit exactly this).
      #
      # It also makes the step report success no matter what, so --fail-with-body
      # is what leaves a trace: without it an HTTP error exits 0 and nothing shows
      # up anywhere.
      - name: Notify Hono server (success)
        if: success()
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          INVITE_URL: ${{ steps.distribute.outputs.TESTING_URI }}
        run: |
          curl -sS --fail-with-body --connect-timeout 10 --max-time 30 \
            -X POST "${WEBHOOK_URL}/api/webhook/build-complete" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -d "{
              \"runId\": ${RUN_ID},
              \"commitSha\": \"${COMMIT_SHA}\",
              \"status\": \"success\",
              \"inviteUrl\": \"${INVITE_URL}\",
              \"message\": \"Build completed\"
            }"

      - name: Notify Hono server (failure)
        if: failure()
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl -sS --fail-with-body --connect-timeout 10 --max-time 30 \
            -X POST "${WEBHOOK_URL}/api/webhook/build-complete" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -d "{
              \"runId\": ${RUN_ID},
              \"commitSha\": \"${COMMIT_SHA}\",
              \"status\": \"failure\",
              \"errorMessage\": \"Build failed in workflow\"
            }"

  # iOS ad-hoc build, in parallel with the Android job. The orchestrator attaches
  # the ipa to the record that shares the commitSha, so arrival order does not
  # matter and only the Android job notifies. Without the signing secrets the job
  # still builds an unsigned .app to prove the sources compile for iOS.
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.10'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Distribution certificate and ad-hoc profile come from secrets. The signing
      # settings go into ios/Flutter/Signing.xcconfig, which the Runner xcconfigs
      # include optionally, so the Xcode project itself stays untouched.
      # Missing secrets are not an error: the job falls back to an unsigned build.
      - name: Prepare iOS signing
        id: signing
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -z "${IOS_CERT_P12_BASE64}" ] || [ -z "${IOS_PROFILE_BASE64}" ] || [ -z "${IOS_TEAM_ID}" ]; then
            echo "::warning::iOS signing secrets are not set; building an unsigned .app only (nothing to distribute)"
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          printf '%s' "${IOS_CERT_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -P "${IOS_CERT_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain-db

          PROFILE="${RUNNER_TEMP}/adhoc.mobileprovision"
          printf '%s' "${IOS_PROFILE_BASE64}" | base64 --decode > "${PROFILE}"
          security cms -D -i "${PROFILE}" > "${RUNNER_TEMP}/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${RUNNER_TEMP}/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "${RUNNER_TEMP}/profile.plist")"
          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${PROFILE}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          cat > ios/Flutter/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${IOS_TEAM_ID}
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          EOF

          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>release-testing</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>tech.unolive.flutterGeneratedApp</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

          echo "signed=true" >> "${GITHUB_OUTPUT}"

      - name: Build iOS (unsigned)
        if: steps.signing.outputs.signed != 'true'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: flutter build ios --release --no-codesign --build-number="${BUILD_NUMBER}"

      # BUILD_NUMBER becomes CFBundleVersion; it matches the Android versionCode so
      # the OTA manifest can report the same number.
      - name: Build ad-hoc ipa
        if: steps.signing.outputs.signed == 'true'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build ipa --release --export-options-plist "${RUNNER_TEMP}/ExportOptions.plist" --build-number="${BUILD_NUMBER}"
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -z "${IPA_PATH}" ]; then
            echo "::error::No ipa was produced under build/ios/ipa"
            exit 1
          fi
          echo "IPA_PATH=${IPA_PATH}" >> "${GITHUB_ENV}"

      # Same endpoint as the APK, platform=ios. continue-on-error for the same reason
      # as the Android upload: the job status should reflect the build.
      - name: Upload ipa to orchestrator
        if: steps.signing.outputs.signed == 'true'
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          curl -sS --fail-with-body --connect-timeout 10 --max-time 300 \
            -X POST "${WEBHOOK_URL}/api/apps/upload?platform=ios&commitSha=${COMMIT_SHA}&runId=${RUN_ID}&versionCode=${BUILD_NUMBER}" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${IPA_PATH}"
